
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Dnyanshree Institute</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101d3b, #243d68);
    padding: 20px;
}

.login-card {
    background: #fff;
    width: 100%;
    max-width: 420px;
    padding: 38px;
    border-radius: 18px;
    box-shadow: 0 15px 45px rgba(0,0,0,.25);
    text-align: center;
}

.logo {
    width: 85px;
    height: 85px;
    object-fit: contain;
    margin-bottom: 12px;
}

h2 {
    color: #172554;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    font-size: 14px;
    margin-bottom: 28px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    background: #172554;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #c49a45;
}

#message {
    margin-top: 15px;
    font-size: 14px;
    color: #dc2626;
}

.footer {
    margin-top: 25px;
    color: #999;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="login-card">

   <img src="institute-logo.png.jpg" alt="Dnyanshree Institute Logo" style="width: 250px; height: 250px; object-fit: contain;">
    <h2>Admin Login</h2>

    <div class="subtitle">
        Dnyanshree Institute of Engineering & Technology, Satara
    </div>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Admin Username"
            autocomplete="username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Admin Password"
            autocomplete="current-password"
            required
        >

        <button type="submit">LOGIN</button>

    </form>

    <div id="message"></div>

    <div class="footer">
        © Dnyanshree Institute of Engineering & Technology
    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.style.color = "#555";
    message.textContent = "Please wait...";

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (data.success) {
            message.style.color = "green";
            message.textContent = "Login successful!";

            window.location.href = "/";
        } else {
            message.style.color = "red";
            message.textContent = data.message || "Login failed.";
        }

    } catch (error) {
        message.style.color = "red";
        message.textContent = "Server connection failed.";
    }

});
</script>

</body>
</html>
